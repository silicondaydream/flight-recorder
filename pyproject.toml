[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-watchdog"
version = "0.2.0"
description = "Watchdog: an MCP proxy and supervisor that watches AI agent sessions and their tool use, and steps in when one is stuck."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# The proxy, the log chain and the tools server use the standard library only, so
# they run anywhere Python does (Devin's session machines included). httpx is for
# the parts that talk to Devin's API and to Teams.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
judge = ["openai>=1.40"]  # the optional LLM judge (a ChatGPT Enterprise / OpenAI API key)
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7", "openai>=1.40"]

[project.scripts]
watchdog = "agent_watchdog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_watchdog = ["*.html", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["demo-target"]  # its own repository, split out for the demo

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "N"]
ignore = ["S603"]  # subprocess without shell: the proxy's whole job is running a child

[tool.ruff.lint.isort]
known-first-party = ["agent_watchdog"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S607"]

[tool.mypy]
strict = true
files = ["src", "tests", "devin-plugin/hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
